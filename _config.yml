theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Kolkata

title: Gyaneshwar Pardhi
tagline: Engineering Manager · Distributed Systems · Technical Leadership

description: >-
  Technical blog by Gyaneshwar Pardhi — engineering management perspectives,
  distributed systems deep-dives, and lessons from building high-performing teams.

url: "https://gyaan.github.io"

github:
  username: gyaan

twitter:
  username: er_gyaneshwar

social:
  name: Gyaneshwar Pardhi
  email: gyaan1334@gmail.com
  links:
    - https://github.com/gyaan
    - https://twitter.com/er_gyaneshwar
    - https://stackoverflow.com/users/565551/gyaneshwar-pardhi

avatar: https://avatars1.githubusercontent.com/u/832071?s=460&v=4

toc: true

comments:
  provider: disqus
  disqus:
    shortname: gyaan-1

pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10

baseurl: ""

# ---------------------------------------------------------------
# Do not modify below unless you know what you are doing
# ---------------------------------------------------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - CLAUDE.md
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
